
    <!DOCTYPE html>
    <html>
        <head>
            <meta http-equiv="content-type" content="text/html; charset=UTF-8">
            <meta name="robots" content="noindex, nofollow">
            <meta name="googlebot" content="noindex, nofollow">
             <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog</title>
    <link rel="stylesheet" href="styles.css">
            <script type="text/javascript" async="true">
                document.getElementById('blogForm').addEventListener('submit', function(e) {
    e.preventDefault();

    // Get form values
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const imageUrl = document.getElementById('image').value;

    // Create a new blog post element
    const blogPost = document.createElement('div');
    blogPost.className = 'blog-post';

    const blogTitle = document.createElement('h2');
    blogTitle.textContent = title;

    const blogDescription = document.createElement('p');
    blogDescription.textContent = description;

    const blogImage = document.createElement('img');
    blogImage.src = imageUrl;

    // Append elements to the blog post
    blogPost.appendChild(blogImage);
    blogPost.appendChild(blogTitle);
    blogPost.appendChild(blogDescription);

    // Append the blog post to the blogPosts container
    document.getElementById('blogPosts').appendChild(blogPost);

    // Clear the form
    document.getElementById('blogForm').reset();
});

            </script>
            <style type="text/css">
                body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}

.container {
    width: 50%;
    margin: auto;
    overflow: hidden;
    padding: 20px;
}

form {
    background: #fff;
    padding: 20px;
    border-radius: 5px;
    margin-bottom: 20px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

label {
    display: block;
    margin-bottom: 5px;
}

input[type="text"],
textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    display: inline-block;
    background: #333;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #555;
}

.blog-posts {
    margin-top: 20px;
}

.blog-post {
    background: #fff;
    padding: 20px;
    border-radius: 5px;
    margin-bottom: 20px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.blog-post img {
    max-width: 100%;
    height: auto;
    border-radius: 5px;
}

.blog-post h2 {
    margin: 0 0 10px;
}

.blog-post p {
    margin: 0;
}

            </style>
        </head>
        <body>
             <div class="container">
        <h1>Create a Blog Post</h1>
        <form id="blogForm">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br><br>

            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea><br><br>

            <label for="image">Image URL:</label>
            <input type="text" id="image" name="image" required><br><br>

            <button type="submit">Post</button>
        </form>

        <div id="blogPosts" class="blog-posts"></div>
    </div>

    <script src="scripts.js"></script>
        </body>
    </html>
